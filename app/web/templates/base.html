<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClipSmith - Autonomous AI Video Clipper{% endblock %}</title>
    <!-- Modern Sans & Mono Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        mono: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a',
                            600: '#52525b',
                            700: '#3f3f46',
                            800: '#27272a',
                            850: '#1e1e22',
                            900: '#141416',
                            950: '#0a0a0c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body {
            background-color: #0a0a0c;
            color: #e4e4e7;
        }
        .mono-card {
            background-color: #121215;
            border: 1px solid #27272a;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .mono-card:hover {
            border-color: #3f3f46;
        }
        .mono-button {
            transition: all 0.15s ease-out;
        }
        .mono-button:active {
            transform: scale(0.97);
        }
        /* 9:16 vertical fullscreen preservation */
        video {
            object-fit: contain;
            background-color: #000000;
        }
        video:fullscreen {
            object-fit: contain !important;
            background-color: #000000 !important;
            max-height: 100vh !important;
        }
        video:-webkit-full-screen {
            object-fit: contain !important;
            background-color: #000000 !important;
            max-height: 100vh !important;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-white selection:text-black">
    <!-- Navbar -->
    <header class="border-b border-mono-800 bg-mono-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <!-- Brand -->
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-lg bg-white text-mono-950 flex items-center justify-center font-bold text-sm shadow-sm group-hover:scale-105 transition-transform">
                    CS
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-base font-semibold tracking-tight text-white">ClipSmith</span>
                    <span class="text-[11px] font-mono px-2 py-0.5 rounded bg-mono-850 text-mono-400 border border-mono-800">
                        v2.0
                    </span>
                </div>
            </a>

            <!-- Navigation Links -->
            <nav class="flex items-center gap-1 sm:gap-2">
                <a href="/" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors {% if request.path == '/' %}bg-mono-850 text-white border border-mono-700{% else %}text-mono-400 hover:text-white hover:bg-mono-900{% endif %}">
                    Home
                </a>
                <a href="/clips" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors {% if request.path.startswith('/clips') or request.path.endswith('/results') %}bg-mono-850 text-white border border-mono-700{% else %}text-mono-400 hover:text-white hover:bg-mono-900{% endif %}">
                    Clips
                </a>
            </nav>

            <!-- Quick Action -->
            <div class="flex items-center gap-3">
                <a href="/" class="mono-button hidden sm:inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-mono-950 hover:bg-mono-200">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Upload Video
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Minimalist Footer -->
    <footer class="border-t border-mono-800/60 py-6 text-center text-xs text-mono-500">
        <p>ClipSmith &mdash; Autonomous AI Video Clipper. Minimalist Monochrome Edition.</p>
    </footer>

    <!-- Global Modern Modal Popup (Confirm & Alert) -->
    <div 
        x-data="globalModalHandler()" 
        x-init="init()"
        x-cloak
        x-show="isOpen"
        @keydown.escape.window="close(false)"
        class="fixed inset-0 z-[100] flex items-center justify-center p-4"
    >
        <!-- Backdrop -->
        <div 
            x-show="isOpen"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            @click="close(false)" 
            class="fixed inset-0 bg-black/80 backdrop-blur-sm"
        ></div>

        <!-- Modal Dialog Box -->
        <div 
            x-show="isOpen"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-95"
            class="relative w-full max-w-md mono-card rounded-2xl p-6 border border-mono-800 shadow-2xl space-y-5 bg-mono-950 z-10"
        >
            <div class="flex items-start gap-4">
                <!-- Icon -->
                <div 
                    class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 border"
                    :class="iconBgClass"
                >
                    <template x-if="type === 'danger'">
                        <svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </template>
                    <template x-if="type === 'warning'">
                        <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </template>
                    <template x-if="type === 'info' || type === 'confirm'">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </template>
                    <template x-if="type === 'success'">
                        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                    </template>
                </div>

                <div class="space-y-1.5 flex-1 min-w-0">
                    <h3 class="text-base font-bold text-white tracking-tight" x-text="title"></h3>
                    <p class="text-xs text-mono-400 leading-relaxed whitespace-pre-line" x-text="message"></p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-end gap-2.5 pt-2 border-t border-mono-850">
                <template x-if="isConfirm">
                    <button 
                        @click="close(false)" 
                        type="button"
                        class="px-4 py-2 rounded-xl text-xs font-semibold text-mono-400 hover:text-white bg-mono-900 hover:bg-mono-850 border border-mono-800 transition-colors"
                        x-text="cancelText"
                    ></button>
                </template>
                <button 
                    @click="close(true)" 
                    type="button"
                    class="mono-button px-4 py-2 rounded-xl text-xs font-bold transition-all"
                    :class="confirmBtnClass"
                    x-text="confirmText"
                ></button>
            </div>
        </div>
    </div>

    <script>
    function globalModalHandler() {
        return {
            isOpen: false,
            title: '',
            message: '',
            type: 'confirm',
            isConfirm: true,
            confirmText: 'Lanjutkan',
            cancelText: 'Batal',
            resolvePromise: null,

            get iconBgClass() {
                if (this.type === 'danger') return 'bg-rose-500/10 border-rose-500/20';
                if (this.type === 'warning') return 'bg-amber-500/10 border-amber-500/20';
                if (this.type === 'success') return 'bg-emerald-500/10 border-emerald-500/20';
                return 'bg-mono-900 border-mono-800';
            },

            get confirmBtnClass() {
                if (this.type === 'danger') return 'bg-rose-600 hover:bg-rose-500 text-white';
                if (this.type === 'success') return 'bg-emerald-500 hover:bg-emerald-400 text-mono-950';
                return 'bg-white hover:bg-mono-200 text-mono-950';
            },

            init() {
                window.showConfirmModal = (options) => {
                    return new Promise((resolve) => {
                        this.title = options.title || 'Konfirmasi Tindakan';
                        this.message = options.message || 'Apakah Anda yakin ingin melanjutkan?';
                        this.type = options.isDanger ? 'danger' : (options.type || 'confirm');
                        this.isConfirm = true;
                        this.confirmText = options.confirmText || 'Ya, Lanjutkan';
                        this.cancelText = options.cancelText || 'Batal';
                        this.resolvePromise = resolve;
                        this.isOpen = true;
                    });
                };

                window.showAlertModal = (options) => {
                    return new Promise((resolve) => {
                        if (typeof options === 'string') {
                            options = { message: options };
                        }
                        this.title = options.title || (options.type === 'danger' || options.type === 'error' ? 'Pemberitahuan' : 'Informasi');
                        this.message = options.message || '';
                        this.type = (options.type === 'error' || options.type === 'danger') ? 'danger' : (options.type || 'info');
                        this.isConfirm = false;
                        this.confirmText = options.buttonText || 'OK';
                        this.resolvePromise = resolve;
                        this.isOpen = true;
                    });
                };
            },

            close(result) {
                this.isOpen = false;
                if (this.resolvePromise) {
                    this.resolvePromise(result);
                    this.resolvePromise = null;
                }
            }
        };
    }
    </script>
</body>
</html>
